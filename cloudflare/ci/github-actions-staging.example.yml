name: deploy-staging-example

# Mẫu tham khảo — KHÔNG tự chạy. Đổi tên thành .yml và cấu hình secrets khi được duyệt.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ deploy-staging để xác nhận"
        required: true

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check src/index.js && node --check src/admin-routes.js && node --check src/api-v1.js
      - run: npm audit --omit=dev
      - run: npm test --if-present

  deploy:
    needs: checks
    if: github.event.inputs.confirm == 'deploy-staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.remote.jsonc
      - name: Smoke health
        run: |
          curl --fail --silent --show-error https://meohay-m0-stg-230403.poseidonxx001.workers.dev/api/v1/health
          curl --fail --silent --show-error https://meohay-m0-stg-230403.poseidonxx001.workers.dev/sitemap.xml > /dev/null
